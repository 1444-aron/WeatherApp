<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="content">
        <select name="cities" id="cities" onchange="weather()" aria-placeholder="Válaszzon">
            <option value="Budapest">Budapest</option>
            <option value="London">London</option>
            <option value="Paris">Párizs</option>
        </select>
    </div>
    <p id="weather">Loading weather data...</p>
    <script>
        var city = document.getElementById("cities")

        function weather()
        {
            var apiUrl = `http://api.weatherapi.com/v1/current.json?key=6d81843e15824bc9a23160939260610&q=${city.options[city.selectedIndex].value}&aqi=no`;
            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('weather').innerText = `The current temperature in ${data.location.name} is ${data.current.temp_c}°C`;
                })
                .catch(error => console.error('Error:', error));
        }
        
    </script>
</body>
</html>
