<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Weather</title>
</head>
<body>
    <div class="content">
        <label for="cities">Select a city:</label>
        <input id="cities" list="city_list"  onchange="weather()">
        <datalist id="city_list">
            <option value="" disabled selected hidden>Select your option</option>
            <option value="Budapest">Budapest</option>
            <option value="Szeged">Szeged</option>
            <option value="Senta">Senta</option>
            <option value="Belgrade">Belgrade</option>
            <option value="London">London</option>
            <option value="Paris">Paris</option>
            <option value="Lisbon">Lisbon</option>
            <option value="Berlin">Berlin</option>
            <option value="Ljubljana">Ljubljana</option>
            <option value="Rome">Rome</option>
            <option value="Athens">Athens</option>
            <option value="Tirana">Tirana</option>
            <option value="Andorra la Vella">Andorra la Vella</option>
            <option value="Yerevan">Yerevan</option>
            <option value="Vienna">Vienna</option>
            <option value="Baku">Baku</option>
            <option value="Minsk">Minsk</option>
            <option value="Brussels">Brussels</option>
            <option value="Sarajevo">Sarajevo</option>
            <option value="Sofia">Sofia</option>
            <option value="Nicosia">Nicosia</option>
            <option value="Prague">Prague</option>
            <option value="Tallinn">Tallinn</option>
            <option value="Helsinki">Helsinki</option>
            <option value="Tbilisi">Tbilisi</option>
            <option value="Reykjavik">Reykjavik</option>
            <option value="Dublin">Dublin</option>
            <option value="Astana">Astana</option>
            <option value="Pristina">Pristina</option>
            <option value="Riga">Riga</option>
            <option value="Vaduz">Vaduz</option>
            <option value="Vilnius">Vilnius</option>
            <option value="Luxembourg">Luxembourg</option>
            <option value="Valletta">Valletta</option>
            <option value="Chisinau">Chisinau</option>
            <option value="Monaco">Monaco</option>
            <option value="Podgorica">Podgorica</option>
            <option value="Skopje">Skopje</option>
            <option value="Oslo">Oslo</option>
        </datalist>
        <div class="main">
            <p id="city">Loading weather data...</p>
            <p id="weather"></p>
            <div class="sidebyside"><p id="text"></p> <img id="img" src="" alt="" sizes="64px" height="64px"></div>
        </div>
        <div class="box2">
            <table>
                <tr>
                    <td>Temperature feels like:</td>
                    <td><span id="feelslike_c"></span></td>
                </tr>
                <tr>
                    <td>Pressure</td>
                    <td><span id="pressure_mb"></span></td>
                </tr>
                <tr>
                    <td>Humidity:</td>
                    <td><span id="humidity"></span></td>
                </tr>
                <tr>
                    <td>UV:</td>
                    <td><span id="uv"></span></td>
                </tr>
                <tr>
                    <td>Wind Speed:</td>
                    <td><span id="wind_kph"></span></td>
                </tr>
                <tr>
                    <td>Wind driceton:</td>
                    <td><span id="wind_degree"></span></td>
                </tr>
                <tr>
                    <td>Chances of rain:</td>
                    <td><span id="chance_of_rain"></span></td>
                </tr>
            </table>            
        </div>
        <div class="box2"><p id="last_updated"></p></div>
        
    </div>
    
    <script src="script.js"></script>
</body>
</html>
